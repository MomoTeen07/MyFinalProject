name: QA CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://football:football@localhost:5432/footballqa
      JWT_SECRET: ci-only-secret-do-not-use-outside-github-actions
      MOCK_FOOTBALL_API: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests

  api-and-ui:
    name: API and UI checks
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-do-not-use-outside-github-actions
      MOCK_FOOTBALL_API: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/pytest/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - name: Start application
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Run API contract checks
        run: |
          python -m pip install -r tests/pytest/requirements.txt
          python -m pytest tests/pytest/tests
      - name: Install Playwright browser
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run UI checks
        working-directory: tests/playwright
        run: npm test
      - name: Save Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
