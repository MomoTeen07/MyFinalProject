services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-footballqa}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-footballqa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD:-football}@db:5432/${POSTGRES_DB:-footballqa}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in .env}
      FOOTBALL_API_TOKEN: ${FOOTBALL_API_TOKEN:-}
      MOCK_FOOTBALL_API: ${MOCK_FOOTBALL_API:-false}
      FOOTBALL_CACHE_TTL_SECONDS: ${FOOTBALL_CACHE_TTL_SECONDS:-300}
      PRESS_FEED_URL: ${PRESS_FEED_URL:-https://rmcsport.bfmtv.com/rss/football/}
      PRESS_TIMEOUT_SECONDS: ${PRESS_TIMEOUT_SECONDS:-5}
      PRESS_CACHE_TTL_SECONDS: ${PRESS_CACHE_TTL_SECONDS:-600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
